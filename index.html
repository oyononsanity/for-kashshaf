<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>For Kashshaf | Eternal Revelation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&family=Satisfy&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="pics/img6.jpeg" fetchpriority="high">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" defer></script>
</head>
<body>

    <div class="global-bg"></div>
    <div id="tulip-container" aria-hidden="true"></div>
    <audio id="bg-music" src="Khat.mp3" loop preload="metadata"></audio>

    <div class="hero-section">
        <div class="hero-overlay"></div>
        <div class="name-header"><h1 class="hero-title">Kashshaf</h1></div>
    </div>

    <div class="timer-section">
        <div class="timer-bar">
            <div class="timer-unit"><span id="d">00</span><small>Days</small></div>
            <div class="timer-unit"><span id="h">00</span><small>Hrs</small></div>
            <div class="timer-unit"><span id="m">00</span><small>Mins</small></div>
            <div class="timer-unit"><span id="s">00</span><small>Secs</small></div>
        </div>
        <p class="timer-note">Jan 26 eye-contact, March 26 first meet. Destiny loves 26.</p>
    </div>

    <section class="gallery-section">
        <h2 class="gallery-title">Gallery of My Love</h2>
        <div class="gallery-wrap">
            <div class="card-stack">
                <div class="g-card gc1" role="button" tabindex="0" data-title="Beginning" data-text="Jan 26. My soul finally recognized someone."><img src="pics/img1.jpg" alt="Beginning" loading="lazy" decoding="async"></div>
                <div class="g-card gc2" role="button" tabindex="0" data-title="Grace" data-text="You carry kindness in your heart."><img src="pics/img1.jpeg" alt="Grace" loading="lazy" decoding="async"></div>
                <div class="g-card gc3" role="button" tabindex="0" data-title="Main" data-text="I can spend a thousand years with you."><img src="pics/im3.jpg" alt="Main" loading="lazy" decoding="async"></div>
                <div class="g-card gc4" role="button" tabindex="0" data-title="Soft Vibe" data-text="Everything feels beautiful with you."><img src="pics/im4.jpg" alt="Soft Vibe" loading="lazy" decoding="async"></div>
                <div class="g-card gc5" role="button" tabindex="0" data-title="Destiny" data-text="You deserve the entire universe."><img src="pics/im5.jpeg" alt="Destiny" loading="lazy" decoding="async"></div>
            </div>
        </div>
    </section>

    <div class="middle-purple-section">
        <div class="music-bar" role="button" tabindex="0" onclick="toggleMusic()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleMusic();}">
            <div class="music-thumb"><img src="pics/img1.jpg" alt="" loading="lazy" decoding="async"></div>
            <div class="music-info">
                <h4 id="music-status">Khat (Tap to Play)</h4>
                <p>Navjot Ahuja</p>
            </div>
        </div>

        <div class="proposal-box" id="prop-box">
            <h2 class="proposal-title">Be My Final Love?</h2>
            <div class="btn-wrap" id="btn-wrap">
                <button class="btn btn-yes" onclick="startLoveBook()">Yes, I Stay</button>
                <button class="btn" id="no-btn" onclick="handleNoClick()" onmouseover="handleNoHover()">Maybe...</button>
            </div>
        </div>
    </div>

<div id="book-modal">
    <div class="book-container">
        <div class="book-page active" id="p1">
            <h2 class="book-title-1">Dearest Kashshaf,</h2>
            <div id="auto-text-p1" class="typewriter-text"></div>
            <div class="book-foot book-foot-sign">
                <span class="book-sign">— Oyon</span>
                <button class="btn btn-yes book-btn-hidden" id="btn-p1" onclick="nextPage(2)">Memories →</button>
            </div>
        </div>

        <div class="book-page" id="p2">
            <img src="pics/img8.jpg" alt="" decoding="async">
            <h3 class="book-title-2">Our Moments</h3>
            <div id="auto-text-p2" class="typewriter-text"></div>
            <div class="book-foot">
                <button class="btn btn-yes book-btn-hidden" id="btn-p2" onclick="nextPage(3)">My Promises →</button>
            </div>
        </div>

        <div class="book-page" id="p3">
            <img src="pics/im4.jpg" alt="" decoding="async">
            <h3 class="book-title-3">My Vow to You</h3>
            <div id="auto-text-p3" class="typewriter-text"></div>
            <div class="book-foot">
                <button class="btn btn-yes book-btn-hidden" id="btn-p3" onclick="nextPage(4)">What I Ask... →</button>
            </div>
        </div>

        <div class="book-page" id="p4">
            <h3 class="book-title-4">Only Two Things...</h3>
            <div id="auto-text-p4" class="typewriter-text"></div>
            <div class="book-foot book-foot-block">
                <button class="btn btn-yes book-btn-hidden" id="btn-p4" onclick="nextPage(5)">The Final Word ❤️</button>
            </div>
        </div>

        <div class="book-page" id="p5">
            <img src="pics/img8.jpg" alt="" decoding="async">
            <h3 class="book-title-3">Forever & Always</h3>
            <div id="auto-text-p5" class="typewriter-text"></div>
            <button class="btn btn-yes book-btn-last" onclick="location.reload()">Forever ❤️</button>
        </div>
    </div>
</div>

    <div id="img-overlay">
        <button class="overlay-close" onclick="closeOverlay()" aria-label="Close">×</button>
        <div class="overlay-content">
            <div class="left-image"><img id="overlay-img" src="" alt=""></div>
            <div class="right-paper">
                <h2 id="paper-title"></h2>
                <p id="paper-text"></p>
                <p class="paper-sign">With All My Love.</p>
            </div>
        </div>
    </div>

 <script>
    // Essential Elements
    const music = document.getElementById('bg-music');
    const musicStatus = document.getElementById('music-status');

    const content = {
        p1: "Kashshaf, you came into my life so quietly, yet somehow became the loudest feeling in my heart. After such a long time, you're the first person who made me feel love this deeply again. 🤍 At first, I only admired you… but slowly your smile, your voice, and even your little habits started staying in my mind longer than they should. What I feel for you is not temporary; it's soft, real, loyal, and pure. I don't just want your attention—I want your peace, your trust, and your heart. 💫 I love you more than words could ever explain. 🤍",
        p2: "Our journey together is filled with these little moments that mean the world to me. Every time we meet or talk, it feels like destiny was working to bring us closer. These are the memories I want to hold onto forever. ✨",
        p3: "I promise to love you endlessly, to value every word you say, and to listen to you with all my heart. I will trust you blindly and stand by you through every storm. I want to build a world where you feel safe, respected, and deeply cherished. 💍",
        p4: "In return, I don't ask for the world. I only ask for your true love and your loyalty. If I have those from you, I have everything I'll ever need. I promise you'll never have to question how deeply you are loved. 🤍",
        p5: "Maybe we weren't each other's first love, but I hope with all my soul that we can be each other's last. If you choose me, I'll spend every day proving that you made the right choice. Forever and always yours. ❤️"
    };

    // Timer Logic
    const timerEls = ['d', 'h', 'm', 's'].map(id => document.getElementById(id));
    const timerStart = new Date("January 26, 2026 00:00:00").getTime();
    function updateTimer() {
        const diff = Math.max(0, Date.now() - timerStart);
        const vals = [
            Math.floor(diff / 86400000),
            Math.floor((diff % 86400000) / 3600000),
            Math.floor((diff % 3600000) / 60000),
            Math.floor((diff % 60000) / 1000)
        ];
        timerEls.forEach((el, i) => { if (el) el.textContent = String(vals[i]).padStart(2, '0'); });
    }
    setInterval(updateTimer, 1000);

    // Music Control
    function toggleMusic() {
        if (music.paused) {
            music.play().then(() => {
                musicStatus.textContent = "Playing: Khat 🎵";
            }).catch(() => {
                musicStatus.textContent = "Khat (Tap to Play)";
            });
        } else {
            music.pause();
            musicStatus.textContent = "Paused: Khat";
        }
    }

    // Auto-typing Logic (emoji-safe, never overlaps if pages change quickly)
    let typingToken = 0;
    function typeEffect(elementId, text, btnId) {
        const target = document.getElementById(elementId);
        if (!target) return;
        const token = ++typingToken;
        const chars = Array.from(text);
        const node = document.createTextNode('');
        target.textContent = '';
        target.appendChild(node);
        let i = 0;
        function type() {
            if (token !== typingToken) return;
            if (i < chars.length) {
                node.appendData(chars[i++]);
                target.scrollTop = target.scrollHeight;
                setTimeout(type, 35);
            } else if (btnId) {
                const btn = document.getElementById(btnId);
                if (btn) btn.style.display = 'block';
            }
        }
        type();
    }

    // Love Book Logic
    function startLoveBook() {
        if (typeof confetti === 'function') {
            confetti({ particleCount: 300, spread: 160, origin: { y: 0.6 } });
        }
        document.getElementById('book-modal').style.display = 'flex';
        document.body.classList.add('no-scroll');
        typeEffect('auto-text-p1', content.p1, 'btn-p1');
    }

    function nextPage(pageNo) {
        document.querySelectorAll('.book-page').forEach(p => p.classList.remove('active'));
        const targetPage = document.getElementById('p' + pageNo);
        if (targetPage) {
            targetPage.classList.add('active');
            typeEffect('auto-text-p' + pageNo, content['p' + pageNo], 'btn-p' + pageNo);
        }
    }

    // Dodge Button: only on real mouse/hover desktops. Touch devices get a normal tappable button.
    const canDodge = window.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 769px)');
    function handleNoHover() {
        if (!canDodge.matches) return;
        const btn = document.getElementById('no-btn');
        const wrap = document.getElementById('btn-wrap');
        if (btn && wrap) {
            const rect = wrap.getBoundingClientRect();
            btn.style.position = 'absolute';
            btn.style.left = Math.random() * Math.max(0, rect.width - btn.offsetWidth) + 'px';
            btn.style.top = Math.random() * Math.max(0, rect.height - btn.offsetHeight) + 'px';
        }
    }

    function handleNoClick() { alert('Are you sure? 🧐'); }

    // Gallery overlay
    function openOverlay(card) {
        const img = card.querySelector('img');
        const big = document.getElementById('overlay-img');
        big.src = img.currentSrc || img.src;
        big.alt = card.dataset.title || '';
        document.getElementById('paper-title').textContent = card.dataset.title;
        document.getElementById('paper-text').textContent = card.dataset.text;
        document.getElementById('img-overlay').style.display = 'flex';
        document.body.classList.add('no-scroll');
    }
    function closeOverlay() {
        document.getElementById('img-overlay').style.display = 'none';
        document.body.classList.remove('no-scroll');
    }

    document.querySelectorAll('.g-card').forEach(card => {
        card.addEventListener('click', () => openOverlay(card));
        card.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openOverlay(card); }
        });
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

    // Falling tulips (lighter on phones, paused when tab is hidden)
    const tulipBox = document.getElementById('tulip-container');
    const tulipEvery = window.innerWidth <= 768 ? 900 : 600;
    setInterval(() => {
        if (document.hidden || !tulipBox) return;
        const t = document.createElement('div');
        t.className = 'falling-tulip';
        t.textContent = '🌷';
        t.style.left = Math.random() * 100 + "vw";
        t.style.animationDuration = (Math.random() * 3 + 5) + "s";
        t.addEventListener('animationend', () => t.remove(), { once: true });
        tulipBox.appendChild(t);
    }, tulipEvery);

    window.addEventListener('load', () => {
        updateTimer();
        document.body.addEventListener('click', () => {
            if (music.paused && music.currentTime === 0) {
                const p = music.play();
                if (p && p.then) p.then(() => music.pause()).catch(() => {});
            }
        }, { once: true });
    });
</script>
</body>
</html>
